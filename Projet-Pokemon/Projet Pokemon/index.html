<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./assets/css/styleIndex.css">

</head>

<body>
    <div id="menu">

        <h1>FAITE VOTRE CHOIX !</h1>

        <div id="cards">
            <button class="card" data-type="feu">
                <img src="./assets/img/arcanin.png" alt="arcanin" class="pokemonImg">
                <h5 class="pokemonName">ARCANIN</h5>
                <p class="hp">HP: 390</p>
            </button>
            <button class="card" data-type="eau">
                <img src="./assets/img/leviator.png" alt="leviator" class="pokemonImg">
                <h5 class="pokemonName">LEVIATOR</h5>
                <p class="hp">HP: 360</p>
            </button>
            <button class="card" data-type="plante">
                <img src="./assets/img/noadkoko.png" alt="noadkoko" class="pokemonImg">
                <h5 class="pokemonName">NOADKOKO</h5>
                <p class="hp">HP: 330</p>
            </button>
        </div>

    </div>

    

</body>

</html>
