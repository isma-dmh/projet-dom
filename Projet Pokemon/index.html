<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./assets/css/styleIndex.css">
    <script src="./assets/script/index.js" defer ></script>

</head>

<body>
    <div id="menu">

        <h1>FAITE VOTRE CHOIX !</h1>

        <div id="cards">
            <button class="card" data-type="feu">
                <img src="./assets/img/arcanin.png" alt="arcanin" class="pokemonImg">
                <h5 class="pokemonName">ARCANIN</h5>
                <p class="hp">HP: 390</p>
            </button>
            <button class="card" data-type="eau">
                <img src="./assets/img/leviator.png" alt="leviator" class="pokemonImg">
                <h5 class="pokemonName">LEVIATOR</h5>
                <p class="hp">HP: 360</p>
            </button>
            <button class="card" data-type="plante">
                <img src="./assets/img/noadkoko.png" alt="noadkoko" class="pokemonImg">
                <h5 class="pokemonName">NOADKOKO</h5>
                <p class="hp">HP: 330</p>
            </button>
        </div>

    </div>

    <!-- PAGE DE BATAILLE -->

    <div id="blocStat">


        <div class="player" data-player="1">

            <div class="info">
                <h2 class="nameStat">Florizarre</h2>
                <p class="hpStat">HP: <span class="life">364</span>/364</p>
            </div>

            <div class="jauge jauge1">
                <div class="vie"></div>
            </div>

            <img class="pokemonImg" src="./assets/img/noadkoko.png" alt="">

        </div>

        <div id="command">


            <div id="message">
                <h2 id="messageP">Un Florizarre sauvage apparait !</h2>
            </div>

            <div id="blocButton">

                <button class="attaque" data-attaque="1">SURF</button>
                <button class="attaque" data-attaque="2">CROC</button>
                <button class="attaque" data-attaque="3">POING A GLACE</button>
                <button class="attaque" data-attaque="4">CANON FLASH</button>

            </div>

        </div>
        <div class="player" data-player="2">

            <div class="info">
                <h2 class="nameStat">Tortank</h2>
                <p class="hpStat">HP: <span class="life">362</span>/362</p>
            </div>

            <div class="jauge">
                <div class="vie"></div>
            </div>

            <img class="pokemonImg" src="assets/img/leviator.png" alt="">

        </div>
    </div>
</body>

</html>
